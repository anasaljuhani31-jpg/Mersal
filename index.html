    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مرسال | الخدمات الإلكترونية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        absherDark: '#004D38',
                        absherGreen: '#006B4D',
                        absherAccent: '#D4AF37',
                        bgLight: '#F8F9FA',
                        mojGold: '#CFB174',
                        ejarCyan: '#008C99',
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif'],
                    },
                    boxShadow: {
                        'premium': '0 4px 20px -2px rgba(0, 77, 56, 0.08)',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #F8F9FA; }
        
        .bg-official-pattern {
            position: fixed; inset: 0; z-index: -1;
            background-image: radial-gradient(#004D38 0.5px, transparent 0.5px);
            background-size: 20px 20px; opacity: 0.03;
        }

        @media (max-width: 768px) {
            .sidebar-mobile {
                position: fixed; right: -100%; top: 0; height: 100%; z-index: 60;
                transition: right 0.3s ease-in-out;
            }
            .sidebar-mobile.open { right: 0; }
            .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; }
            .overlay.open { display: block; }
        }

        .step-circle {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid #E5E7EB; display: flex;
            align-items: center; justify-content: center;
            background: white; z-index: 10; font-weight: bold; transition: all 0.3s;
        }
        .step-circle.active { background: #004D38; border-color: #D4AF37; color: white; }
        
        .select-card { cursor: pointer; border: 2px solid transparent; background: white; transition: all 0.3s; }
        .select-card:hover { transform: translateY(-4px); border-color: #006B4D; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .select-card.selected { border-color: #004D38; background-color: #F6FFFC; }
        
        .nav-item { border-right: 4px solid transparent; transition: 0.2s; }
        .nav-item.active { background: rgba(0,0,0,0.2); border-right-color: #D4AF37; font-weight: bold; }
        
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3;
            border-top: 4px solid #004D38; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
